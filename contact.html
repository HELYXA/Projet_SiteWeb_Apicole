<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Rucher La Prévende</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="container header-container">
            <img src="assets/logo/logo.png" alt="Logo Rucher" class="logo">

            <nav class="nav">
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="produits.html">Produits</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <!-- ===== TITRE PAGE ===== -->
    <section class="page-title">
        <h1>Contactez-nous</h1>
    </section>


    <!-- ===== SECTION CONTACT ===== -->
    <section class="contact-section">
        <div class="container contact-container">

            <!-- FORMULAIRE -->
            <div>
                <form class="contact-form" id="contactForm">
                    <input type="text" id="nom" placeholder="Votre nom" required>
                    <input type="email" id="email" placeholder="Votre email" required>
                    <textarea id="message" placeholder="Votre message" required></textarea>

                    <button type="submit" class="btn">Envoyer</button>
                </form>

                <p id="confirmationMessage" style="display:none; margin-top:15px;">
                     Message envoyé avec succès !
                </p>
            </div>

            <!-- INFOS -->
            <div class="contact-info">
                <h3>Le Rucher La Prévende</h3>
                <p>Localisation : Landes, France</p>
                <p>Adresse mail : contact@rucher-prevente.fr</p>
                <p>Téléphone : 06 00 00 00 00</p>
            </div>

        </div>
    </section>


    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <p>© 2026 Rucher La Prévende — Tous droits réservés</p>
    </footer>

    <!-- ===== SCRIPT JS ===== -->
    <script src="js/script.js"></script>

</body>
</html>
